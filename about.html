<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=index.html#about">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to About — Đinh Tấn Thành</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #06080e;
            --text-main: #f3f6fc;
            --text-muted: #9ba8bd;
            --cyan-glow: #00f5ff;
            --purple-glow: #a855f7;
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .redirect-card {
            padding: 40px 36px;
            background: rgba(13, 17, 28, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 245, 255, 0.15);
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(0, 245, 255, 0.2);
            border-top: 3px solid var(--cyan-glow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--cyan-glow), var(--purple-glow));
            color: #06080e;
            text-decoration: none;
            font-weight: 800;
            border-radius: 30px;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        a:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h2>Đang chuyển hướng đến About...</h2>
        <p>Nếu trang không tự động tải, hãy bấm nút bên dưới:</p>
        <a href="index.html#about"><i class="fas fa-arrow-right"></i> Xem About Me</a>
    </div>
</body>
</html>
